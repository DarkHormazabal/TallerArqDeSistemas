plugins {
    id 'idea'
    id 'java'
    id('io.ebean') version '13.23.1'
}

ext {
    ebeanVersion = '13.23.1'
    sqliteVersion = '3.45.3.0'
    javalinVersion = '6.1.3'
    lombokVersion = '1.18.32'
    gsonVersion = '2.10.1'
    logbackVersion = '1.5.6'
    commonsLangVersion = '3.14.0'
    javaFakerVersion = '2.2.2'
}

group = "org.example"
version = "1.0-SNAPSHOT"

repositories {
    mavenLocal()
    mavenCentral()
}

//version importante
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

compileJava {
    options.release = 17
    options.encoding = 'UTF-8'
}

dependencies {
    // junit
    testImplementation platform("org.junit:junit-bom:5.9.1")
    testImplementation "org.junit.jupiter:junit-jupiter"

    // ebean
    implementation "io.ebean:ebean:${ebeanVersion}"
    implementation "io.ebean:ebean-ddl-generator:${ebeanVersion}"
    implementation "io.ebean:ebean-sqlite:${ebeanVersion}"
    testImplementation "io.ebean:ebean-test:${ebeanVersion}"
    annotationProcessor "io.ebean:querybean-generator:${ebeanVersion}"

    // mysql
    implementation 'mysql:mysql-connector-java:8.0.28'

    // database
    implementation "org.xerial:sqlite-jdbc:${sqliteVersion}"
    implementation "com.h2database:h2:2.2.220"

    // json
    implementation "com.google.code.gson:gson:${gsonVersion}"

    // web: javalin
    implementation "io.javalin:javalin:${javalinVersion}"

    // lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // logger
    implementation "ch.qos.logback:logback-core:${logbackVersion}"
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // commons-lang3
    implementation "org.apache.commons:commons-lang3:${commonsLangVersion}"

    //dataFaker
    implementation "net.datafaker:datafaker:${javaFakerVersion}"

    // Jackson Core
    implementation "com.fasterxml.jackson.core:jackson-core:2.17.1"

    //jackson core
    implementation "com.fasterxml.jackson.core:jackson-databind:2.17.1"

    //jackson module
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin:2.17.0"

    //ObjectMapping
    implementation "org.mapstruct:mapstruct:1.4.2.Final" // Reemplaza con la última versión disponible
    annotationProcessor "org.mapstruct:mapstruct-processor:1.4.2.Final" // Reemplaza con la última versión disponible

    implementation "org.modelmapper:modelmapper:3.2.0"
}

ebean {
    debugLevel = 9 //0 - 9
}

test {
    useJUnitPlatform()
    testLogging.showStandardStreams = true
    testLogging.exceptionFormat = 'full'
}

idea {
    module {
        sourceDirs += file("src/generated/main/java")

    }
}
//esto ayuda
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
                'Main-Class': 'org.example.Main'
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

}
